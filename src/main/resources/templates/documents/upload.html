<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Uploader un document</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header">Nouveau fichier</div>
        <div class="card-body">

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

            <form th:action="@{/documents/upload}" method="post"
                  enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Type de document</label>
                    <select name="typeDocumentId" class="form-select" required>
                        <option value="">— choisir —</option>
                        <option th:each="t : ${types}"
                                th:value="${t.id}" th:text="${t.libelle}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fichier</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                <button class="btn btn-primary">Envoyer</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
