<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h4>Bienvenue
                <span th:text="${currentUser?.login}">utilisateur</span> 👋
            </h4>
            <p class="text-muted">Vous êtes connecté.</p>

            <ul>
                <li><strong>ID :</strong> <span th:text="${currentUser?.id}"></span></li>
                <li><strong>Employé lié :</strong>
                    <span th:text="${currentUser?.idEmploye ?: '—'}"></span></li>
                <li><strong>Rôles :</strong>
                    <span th:text="${currentUser != null and !#lists.isEmpty(currentUser.roles)
                                    ? #strings.listJoin(currentUser.roles, ', ')
                                    : 'aucun'}"></span></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
