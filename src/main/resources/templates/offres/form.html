<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle offre d'emploi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container" style="max-width: 900px;">
    <h4 class="mb-3">Nouvelle offre d'emploi</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Récapitulatif du besoin (lecture seule) -->
    <div class="card shadow-sm mb-3">
        <div class="card-header">Besoin à pourvoir</div>
        <div class="card-body">
            <div class="row g-2 small">
                <div class="col-md-6"><strong>Poste :</strong> <span th:text="${besoin.poste ?: '—'}"></span></div>
                <div class="col-md-6"><strong>Unité :</strong> <span th:text="${besoin.unite}"></span>
                    <span class="text-muted" th:text="'(' + ${besoin.uniteType} + ')'"></span></div>
                <div class="col-md-6"><strong>Effectif :</strong> <span th:text="${besoin.effectif}"></span></div>
                <div class="col-md-6"><strong>Date souhaitée :</strong>
                    <span th:text="${besoin.dateSouhaitee != null ? #temporals.format(besoin.dateSouhaitee, 'dd/MM/yyyy') : '—'}"></span></div>
                <div class="col-md-6"><strong>Motif :</strong> <span th:text="${besoin.motif}"></span></div>
                <div class="col-md-6"><strong>Fourchette (grille) :</strong>
                    <span th:if="${besoin.salaireMin != null}"
                          th:text="${#numbers.formatDecimal(besoin.salaireMin, 1, 'WHITESPACE', 0, 'COMMA')} + ' – ' + ${#numbers.formatDecimal(besoin.salaireMax, 1, 'WHITESPACE', 0, 'COMMA')} + ' Ar'"></span>
                    <span th:if="${besoin.salaireMin == null}">—</span></div>
            </div>
        </div>
    </div>

    <form th:action="@{/rh/offres/nouvelle}" th:object="${form}" method="post" id="formOffre"
          class="card shadow-sm">
        <div class="card-body">

            <!-- Besoin : chargé depuis « Ouvrir Recrutement », champ désactivé.
                 Un input disabled n'est pas envoyé → on transmet l'id en hidden. -->
            <div class="mb-3">
                <label class="form-label">Besoin</label>
                <input type="text" class="form-control" disabled
                       th:value="${besoin.reference} + ' – ' + ${besoin.poste ?: ''}">
                <input type="hidden" th:field="*{idBesoin}">
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Référence *</label>
                    <input type="text" class="form-control" th:field="*{reference}" maxlength="50" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Type de contrat <span class="text-muted">(facultatif)</span></label>
                    <select class="form-select" th:field="*{idTypeContrat}">
                        <option value="">— non précisé —</option>
                        <option th:each="t : ${typesContrat}" th:value="${t.id}" th:text="${t.libelle}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date de publication</label>
                    <input type="date" class="form-control" th:field="*{datePublication}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date limite de candidature *</label>
                    <input type="date" class="form-control" th:field="*{dateLimiteCandidature}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Description du poste <span class="text-muted">(dans le PDF)</span></label>
                    <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Profil recherché <span class="text-muted">(dans le PDF)</span></label>
                    <textarea class="form-control" rows="4" th:field="*{profil}"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">État à l'enregistrement</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{etat}" value="PUBLIEE" id="etatPub">
                            <label class="form-check-label" for="etatPub">Publier tout de suite</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{etat}" value="BROUILLON" id="etatBr">
                            <label class="form-check-label" for="etatBr">Brouillon (relecture)</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer d-flex gap-2 justify-content-end">
            <a th:href="@{/rh/offres/besoins}" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-outline-primary"
                    th:formaction="@{/rh/offres/apercu}" formtarget="_blank" formnovalidate>Aperçu</button>
            <button type="submit" class="btn btn-primary">Valider et générer le PDF</button>
        </div>
    </form>
</div>
</body>
</html>
