<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offres d'emploi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">Offres d'emploi</h4>
        <a th:href="@{/rh/offres/besoins}" class="btn btn-primary btn-sm">+ Nouvelle offre</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr><th>Réf.</th><th>Besoin</th><th>Poste</th><th>Contrat</th><th>Publication</th>
                <th>Date limite</th><th>État</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(offres)}">
                <td colspan="8" class="text-muted text-center py-4">Aucune offre pour le moment.</td>
            </tr>
            <tr th:each="o : ${offres}" th:with="b=${besoins[o.idBesoin]}">
                <td th:text="${o.ref}"></td>
                <td th:text="${b != null ? b.reference : o.idBesoin}"></td>
                <td th:text="${b != null and b.poste != null ? b.poste : '—'}"></td>
                <td th:text="${o.typeContrat != null ? o.typeContrat.libelle : '—'}"></td>
                <td th:text="${o.datePublication != null ? #temporals.format(o.datePublication, 'dd/MM/yyyy') : '—'}"></td>
                <td th:text="${o.dateLimiteCandidature != null ? #temporals.format(o.dateLimiteCandidature, 'dd/MM/yyyy') : '—'}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${o.etat == 'PUBLIEE'} ? 'bg-success' : (${o.etat == 'BROUILLON'} ? 'bg-secondary' : 'bg-dark')"
                          th:text="${o.etat}"></span>
                </td>
                <td class="text-end text-nowrap">
                    <a th:if="${o.document != null}" class="btn btn-outline-secondary btn-sm" target="_blank"
                       th:href="@{/rh/offres/{id}/pdf(id=${o.id})}">PDF</a>
                    <form th:if="${o.etat == 'BROUILLON'}" th:action="@{/rh/offres/{id}/publier(id=${o.id})}"
                          method="post" class="d-inline">
                        <button class="btn btn-success btn-sm">Publier</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
