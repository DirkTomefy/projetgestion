<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Besoins à recruter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">Besoins dont le recrutement est ouvert</h4>
        <a th:href="@{/rh/offres}" class="btn btn-outline-secondary btn-sm">Voir les offres</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr><th>Réf.</th><th>Poste</th><th>Unité</th><th>Effectif</th><th>Date souhaitée</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(besoins)}">
                <td colspan="6" class="text-muted text-center py-4">
                    Aucun besoin avec recrutement ouvert (bouton « Ouvrir Recrutement » de P3).
                </td>
            </tr>
            <tr th:each="b : ${besoins}">
                <td th:text="${b.reference}"></td>
                <td th:text="${b.poste ?: '—'}"></td>
                <td th:text="${b.unite}"></td>
                <td th:text="${b.effectif}"></td>
                <td th:text="${b.dateSouhaitee != null ? #temporals.format(b.dateSouhaitee, 'dd/MM/yyyy') : '—'}"></td>
                <td class="text-end">
                    <a class="btn btn-primary btn-sm" th:href="@{/rh/offres/nouvelle(idBesoin=${b.id})}">Créer l'offre</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
